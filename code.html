                    playerFemale: makeThreeMat(0xC86B8B),
                    skin: makeThreeMat(0xF5D0A8),
                    pet: makeThreeMat(0xF4EEE1)
                };

                const meadow = new THREE.Mesh(new THREE.PlaneGeometry(42, 42), mats.meadow);
                meadow.rotation.x = -Math.PI / 2;
                meadow.receiveShadow = true;
                scene.add(meadow);

                const farm = new THREE.Mesh(new THREE.BoxGeometry(12.4, 0.16, 15.4), mats.farm);
                farm.position.y = 0.02;
                farm.receiveShadow = true;
                scene.add(farm);

                const path = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.05, 12.5), mats.path);
                path.position.y = 0.12;
                scene.add(path);
                const crossPath = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.055, 0.9), mats.path);
                crossPath.position.set(0, 0.13, 1.1);
                scene.add(crossPath);

                const cabin = new THREE.Group();
                const cabinBody = new THREE.Mesh(new THREE.BoxGeometry(3.0, 1.7, 2.2), mats.cabin);
                cabinBody.position.y = 0.95;
                cabinBody.castShadow = true;
                cabin.add(cabinBody);
                const roof = new THREE.Mesh(new THREE.ConeGeometry(2.45, 1.15, 4), mats.roof);
                roof.position.y = 2.15;
                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true;
                cabin.add(roof);
                cabin.position.set(0, 0, -5.25);
                scene.add(cabin);

                const plotMeshes = Array.from({ length: 9 }, () => {
                    const group = new THREE.Group();
                    const base = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.18, 1.35), mats.soil);
                    base.position.y = 0.2;
                    base.castShadow = true;
                    base.receiveShadow = true;
                    group.add(base);
                    const crop = new THREE.Group();
                    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.65, 8), mats.sprout);
                    stem.position.y = 0.62;
                    stem.castShadow = true;
                    crop.add(stem);
                    const fruit = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 10), mats.carrot);
                    fruit.position.y = 1.05;
                    fruit.castShadow = true;
                    crop.add(fruit);
                    group.add(crop);
                    scene.add(group);
                    return { group, base, crop, fruit };
                });

                const player = new THREE.Group();
                const playerBodyGeom = THREE.CapsuleGeometry
                    ? new THREE.CapsuleGeometry(0.28, 0.7, 6, 10)
                    : new THREE.CylinderGeometry(0.28, 0.34, 1.05, 12);
                const playerBody = new THREE.Mesh(playerBodyGeom, mats.playerMale);
                playerBody.position.y = 0.75;
                playerBody.castShadow = true;
                player.add(playerBody);
                const playerHead = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 12), mats.skin);
                playerHead.position.y = 1.35;
                playerHead.castShadow = true;
                player.add(playerHead);
                scene.add(player);

                const pet = new THREE.Group();
                const petBody = new THREE.Mesh(new THREE.SphereGeometry(0.28, 14, 10), mats.pet);
                petBody.scale.set(1.15, 0.8, 0.85);
                petBody.position.y = 0.38;
                petBody.castShadow = true;
                pet.add(petBody);
                const petHead = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 8), mats.pet);
                petHead.position.set(0.22, 0.6, -0.06);
                petHead.castShadow = true;
                pet.add(petHead);
                scene.add(pet);

                threeFarm = { renderer, scene, camera, mats, plotMeshes, player, playerBody, pet, farm, decorationGroup: new THREE.Group() };
                scene.add(threeFarm.decorationGroup);
                
                const decList = Array.isArray(window.gameConfig.decorations) ? window.gameConfig.decorations : [];
                decList.forEach(dec => {
                    if (!dec.visible) return;
                    const pos = farmToWorld(FARM_X + dec.x * (FARM_WIDTH/600), FARM_Y + dec.y * (FARM_HEIGHT/900));
                    let mesh;
                    if (dec.type === 'tree') {
                        mesh = new THREE.Group();
                        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 1.2, 8), mats.cabin);
                        trunk.position.y = 0.6;
                        mesh.add(trunk);
                        const leaves = new THREE.Mesh(new THREE.SphereGeometry(0.8, 12, 10), mats.sprout);
                        leaves.position.y = 1.6;
                        mesh.add(leaves);
                    } else if (dec.type === 'fence') {
                        mesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.6, 0.1), mats.cabin);
                        mesh.position.y = 0.3;
                    } else if (dec.type === 'flowerPatch') {
                        mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.1, 12), mats.flower);
                        mesh.position.y = 0.05;
                    }
                    if (mesh) {
                        mesh.position.set(pos.x, mesh.position.y || 0, pos.z);
                        mesh.castShadow = true;
                        mesh.receiveShadow = true;
                        threeFarm.decorationGroup.add(mesh);
                    }
                });
                
                threeCanvas.classList.add('active');
                return true;
            }
            function renderThreeFarm(timestamp) {
                if (!initThreeFarm()) return false;
                const tf = threeFarm;
                tf.scene.background = new THREE.Color(getSkyColor());
                tf.farm.material.color.set(window.gameConfig.colorPalette.grass || '#8B9D83');

                window.gameConfig.soilPlots.forEach((plot, idx) => {
                    const mesh = tf.plotMeshes[idx];
                    if (!mesh) return;
                    const pos = farmToWorld(plot.x + PLOT_SIZE / 2, plot.y + PLOT_SIZE / 2);
                    mesh.group.position.set(pos.x, 0, pos.z);
                    mesh.base.material = plot.growthStage === 3 ? tf.mats.soilReady : tf.mats.soil;
                    mesh.crop.visible = !!plot.crop && plot.growthStage > 0;
                    if (mesh.crop.visible) {
                        const stageScale = plot.growthStage === 1 ? 0.45 : plot.growthStage === 2 ? 0.72 : 1;
                        mesh.crop.scale.setScalar(stageScale);
                        mesh.crop.rotation.y = timestamp * 0.001 + idx;
                        mesh.fruit.visible = plot.growthStage === 3;
                        mesh.fruit.material = tf.mats[plot.crop] || tf.mats.flower;
                    }
                });

                const playerWorld = farmToWorld(PLAYER_X, PLAYER_Y);
                tf.player.position.set(playerWorld.x, Math.sin(playerBob) * 0.05, playerWorld.z);
                tf.player.rotation.y += 0.018;
                tf.playerBody.material = (window.gameConfig.player.character || 'male') === 'female'
                    ? tf.mats.playerFemale
                    : tf.mats.playerMale;

                const petWorld = farmToWorld(petPos.x, petPos.y);
                tf.pet.position.set(petWorld.x, 0.05 + Math.sin(petBounce) * 0.04, petWorld.z);

                const targetX = playerWorld.x * 0.18;
                const targetZ = playerWorld.z * 0.12;
                tf.camera.position.x += (targetX - tf.camera.position.x) * 0.04;
                tf.camera.position.z += (13 + targetZ - tf.camera.position.z) * 0.04;
                tf.camera.lookAt(playerWorld.x * 0.2, 0.4, playerWorld.z * 0.2);
                tf.renderer.render(tf.scene, tf.camera);
                return true;
            }
            // ============================================================
            // START SCREEN PARTICLES
            // ============================================================
            let startParticles = Array.from({ length: 12 }, () => ({
                x: Math.random() * 100,
                y: Math.random() * 100,
                vx: (Math.random() - 0.5) * 15,
                vy: -5 - Math.random() * 10,
                emoji: ['🍂', '🌿', '🌻', '🦋', '🌾'][Math.floor(Math.random() * 5)],
                size: 16 + Math.random() * 12,
                phase: Math.random() * Math.PI * 2
            }));
            function renderStartScreen(dt) {
                if (!document.getElementById('start-screen').classList.contains('hidden')) {
                    // Animate leaf particles on start screen canvas... actually we'll just use CSS for start screen
                }
            }
            // ============================================================
            // MAIN GAME LOOP
            // ============================================================
            let dt = 0;
            let loopStarted = false;
            function isMenuHidden() {
                const screen = startScreenEl || document.getElementById('start-screen');
                return screen && screen.classList.contains('hidden');
            }
            function gameLoop(timestamp) {
                loopStarted = true;
                dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 100) dt = 16;
                if (dt < 0) dt = 16;
                try {
                    if (canvas.width < 2 || canvas.height < 2) resizeCanvas();
                    const showGame = currentMode === 'edit' || currentMode === 'play';
                    const menuHidden = isMenuHidden();
                    if (showGame && (gameStarted || currentMode === 'edit' || menuHidden)) {
                        if (gameStarted || currentMode === 'edit') update(dt);
                        if (currentScene === 'farm') {
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            if (!renderThreeFarm(timestamp)) {
                                renderSky(dt);
                                renderFarm(dt, timestamp);
                            }
                        } else if (currentScene === 'rest') {
                            renderRestScene(dt);
                        }
                    }
                } catch (err) {
                    if (!window.__wmRenderError) {
                        window.__wmRenderError = String(err && err.message ? err.message : err);
                        console.error('[Whispering Meadows] render:', err);
                    }
                }
                requestAnimationFrame(gameLoop);
            }
            // Initialize
            updateHarvestCounter();
            updateTimeDisplay();
            function beginPlaySession() {
                menuTransitioning = false;
                const screen = startScreenEl || document.getElementById('start-screen');
                if (screen) {
                    screen.classList.add('hidden');
                    screen.classList.remove('hiding');
                }
                if (menuParticleFrame) {
                    cancelAnimationFrame(menuParticleFrame);
                    menuParticleFrame = null;
                }
                const ui = document.getElementById('ui-overlay');
                if (ui) ui.style.display = '';
                resizeCanvas();
                canvas.style.pointerEvents = 'auto';
                gameStarted = true;
                updateHotbar();
                updateHarvestCounter();
                startAutoSave();
                if (typeof menuMusicMuted !== 'undefined' && !menuMusicMuted) {
                    void startBgMusic().catch(() => {});
                }
            }
            window.__wmForceBeginPlay = beginPlaySession;
            window.__wmStartGame = function (e) {
                if (e) { e.preventDefault(); e.stopPropagation(); }
                window.__wmUserStarted = true;
                if (gameStarted) return;
                if (typeof openStarterSetup === 'function') {
                    openStarterSetup();
                } else {
                    beginPlaySession();
                }
            };

            lastTime = performance.now();
            requestAnimationFrame(gameLoop);

            if (currentMode === 'edit') {
                startScreenEl.classList.add('hidden');
                beginPlaySession();
            } else if (currentMode === 'play') {
                if (window.__wmUserStarted) {
                    beginPlaySession();
                } else {
                    const ui = document.getElementById('ui-overlay');
                    if (ui) ui.style.display = 'none';
                    setupMainMenu();
                }
            }
            window.__wmRunComplete = true;
        } // end run()

        /* Local dev + Astrocade: start game if host never calls run() */
        (function bootWhisperingMeadows() {
            if (!window.gameConfig) {
                window.gameConfig = {
                    crops: { available: ['carrot', 'tomato', 'wheat', 'flower'], growthSpeedMultiplier: 1 },
                    soilPlots: [],
                    decorations: [
                        { type: 'tree', x: 100, y: 180, visible: true },
                        { type: 'tree', x: 500, y: 160, visible: true },
                        { type: 'fence', x: 300, y: 150, visible: true },
                        { type: 'flowerPatch', x: 50, y: 300, visible: true }
                    ],
                    pet: { type: 'bunny', speed: 1 },
                    atmosphere: { timeOfDay: 'afternoon', cycleSpeed: 'normal', weather: 'sunny', particleDensity: 1 },
                    colorPalette: { grass: '#8B9D83', cabin: '#A67C52', sky: '#B8D4E8' },
                    audio: {
                        backgroundMusic: 'background_music_lofi',
                        musicVolume: 0.5, sfxVolume: 0.7, ambientVolume: 0.6
                    },
                    inventory: {
                        seeds: { carrot: 5, tomato: 5, wheat: 5, flower: 3 },
                        harvested: { carrot: 0, tomato: 0, wheat: 0, flower: 0 }
                    },
                    gameDay: 1
                };
            }
            if (!window.mode) window.mode = 'play';
            if (typeof window.lib === 'undefined') {
                window.lib = {
                    getAsset: function () { return undefined; },
                    log: function (m) { console.log('[Whispering Meadows]', m); },
                    showGameParameters: function () {},
                    getUserGameState: async function () { return { state: null }; },
                    saveUserGameState: async function () { return { success: true }; }
                };
            }
            function isLocalPreview() {
                try {
                    var h = (typeof location !== 'undefined' && location.hostname) || '';
                    return h === 'localhost' || h === '127.0.0.1' || h === '';
                } catch (e) {
                    return true;
                }
            }
            function startRun() {
                if (window.__wmRunStarted || typeof run !== 'function') return;
                window.__wmRunPromise = run(window.mode || 'play').catch(function (err) {
                    window.__wmBootError = String(err && err.stack ? err.stack : err);
                    console.error('[Whispering Meadows] run() failed:', err);
                });
            }
            if (isLocalPreview()) {
                var kick = function () { setTimeout(startRun, 100); };
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', kick);
                } else {
                    kick();
                }
            }
        })();
    </script>
</body>
</html>
